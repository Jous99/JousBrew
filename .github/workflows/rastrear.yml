name: Rastrear noticias Switch 2

# Cuándo se ejecuta este workflow
on:
  schedule:
    # Todos los días a las 08:00 UTC (10:00 en España en horario de verano).
    # El formato es de cron:  minuto hora día mes día-semana
    - cron: "0 8 * * *"
  workflow_dispatch:  # permite también lanzarlo a mano desde la pestaña "Actions"

# Permiso para que el workflow pueda hacer commit al repositorio
permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    steps:
      # 1) Descarga el código del repositorio
      - name: Descargar el repo
        uses: actions/checkout@v4

      # 2) Prepara Python
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3) Instala las dependencias (feedparser)
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4) Ejecuta el rastreador
      - name: Ejecutar rastreador
        run: python rastrear.py

      # 5) Si hay cambios, hace commit y push automáticamente
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Si no hay nada que guardar, no hacemos nada (evita commits vacíos)
          if [ -n "$(git status --porcelain)" ]; then
            git add NOTICIAS.md data/visto.json
            git commit -m "Actualizar noticias de Switch 2 ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No hay cambios que guardar."
          fi
